<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annote React QA</title>
    <style>
      body {
        margin: 0;
        background: #f6f1e8;
        color: #141414;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        gap: 24px;
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 24px 120px;
      }
      section {
        border: 1px solid rgba(20,20,20,.12);
        border-radius: 8px;
        background: #fff;
        padding: 20px;
        box-shadow: 0 18px 40px rgba(20,20,20,.08);
      }
      button,
      .row {
        cursor: pointer;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 10px;
        border: 1px solid rgba(20,20,20,.1);
        border-radius: 6px;
        padding: 12px;
      }
      #portal-root {
        position: fixed;
        right: 28px;
        bottom: 28px;
      }
      .portal-button,
      .primary-button {
        border: 0;
        border-radius: 6px;
        background: #1a6f5a;
        color: white;
        padding: 10px 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="react-root-a"></div>
      <div id="react-root-b"></div>
    </main>
    <div id="portal-root"></div>
    <script src="/dist/react-qa.js?v=react-context-hardening"></script>
  </body>
</html>
